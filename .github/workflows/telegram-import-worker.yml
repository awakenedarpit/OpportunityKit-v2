name: Telegram import queue worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-import-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Process one queued Telegram import
        env:
          APP_BASE_URL: ${{ secrets.OPPORTUNITYKIT_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.OPPORTUNITYKIT_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing OPPORTUNITYKIT_APP_BASE_URL or OPPORTUNITYKIT_CRON_SECRET repository secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 70 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/telegram/worker"
